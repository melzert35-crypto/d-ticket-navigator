name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name d_ticket_navigator \
            .

      - name: Restore test file
        run: |
          git checkout -- test/widget_test.dart

      - name: Prepare GTFS data
        run: |
          set -e

          echo "========================================"
          echo "Preparing GTFS data"
          echo "========================================"

          mkdir -p assets/data
          mkdir -p /tmp/gtfs

          echo "Downloading current Germany GTFS feed..."

          curl -L --fail \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            -o /tmp/gtfs/latest.zip \
            https://download.gtfs.de/germany/nv_free/latest.zip

          echo "Download finished."

          echo "Checking ZIP file..."

          test -s /tmp/gtfs/latest.zip

          unzip -t /tmp/gtfs/latest.zip > /dev/null

          echo "ZIP file is valid."

          echo "Extracting stops.txt..."

          unzip -j -o \
            /tmp/gtfs/latest.zip \
            'stops.txt' \
            -d assets/data

          echo "Checking generated asset..."

          test -s assets/data/stops.txt

          echo "GTFS asset successfully created."

          echo "File size:"
          ls -lh assets/data/stops.txt

          echo "Number of lines:"
          wc -l assets/data/stops.txt

          echo "First lines:"
          head -n 5 assets/data/stops.txt

      - name: Verify Flutter asset configuration
        run: |
          set -e

          echo "Checking pubspec.yaml..."

          grep -n "assets/data/stops.txt" pubspec.yaml

          echo "Checking asset file..."

          test -s assets/data/stops.txt

          echo "Asset configuration OK."

      - name: Set compile SDK
        run: |
          set -e

          sed -i \
            's/flutter.compileSdkVersion/36/g' \
            android/app/build.gradle.kts

          sed -i \
            's/flutter.targetSdkVersion/36/g' \
            android/app/build.gradle.kts

          echo "compileSdk configuration:"
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Analyze
        run: |
          flutter analyze

      - name: Test
        run: |
          flutter test

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Check APK
        run: |
          set -e

          test -s build/app/outputs/flutter-apk/app-release.apk

          echo "APK successfully created."

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d-ticket-navigator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
