name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name d_ticket_navigator \
            .

      - name: Restore test file
        run: |
          git checkout -- test/widget_test.dart

      - name: Prepare GTFS data
        run: |
          set -e

          echo "========================================"
          echo "Preparing GTFS data"
          echo "========================================"

          mkdir -p /tmp/gtfs

          echo "Downloading current Germany GTFS feed..."

          curl -L --fail \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            -o /tmp/gtfs/latest.zip \
            https://download.gtfs.de/germany/nv_free/latest.zip

          echo "Download finished."

          test -s /tmp/gtfs/latest.zip

          echo "Checking ZIP file..."

          unzip -t /tmp/gtfs/latest.zip > /dev/null

          echo "GTFS ZIP is valid."

          ls -lh /tmp/gtfs/latest.zip

      - name: Build station search index
        run: |
          set -e

          echo "========================================"
          echo "Building station search index"
          echo "========================================"

          rm -rf assets/data/stations
          mkdir -p assets/data/stations

          python3 tool/build_stops_index.py \
            /tmp/gtfs/latest.zip \
            assets/data/stations

          echo ""
          echo "Generated station index files:"
          find assets/data/stations -maxdepth 1 -type f | sort

          echo ""
          echo "Number of index files:"
          find assets/data/stations -maxdepth 1 -type f | wc -l

          echo ""
          echo "Checking important buckets..."

          test -s assets/data/stations/r.json
          test -s assets/data/stations/w.json

          echo "Station index successfully created."

      - name: Build stop name lookup
        run: |
          set -e
          python3 tool/build_stop_names.py \
            /tmp/gtfs/latest.zip \
            assets/data/routing/patterns.json \
            assets/data/routing/stop_names.json
          test -s assets/data/routing/stop_names.json

      - name: Verify Flutter asset configuration
        run: |
          set -e

          echo "Checking pubspec.yaml..."

          grep -n "assets/data/stations/" pubspec.yaml

          echo "Checking station index..."

          test -s assets/data/stations/r.json
          test -s assets/data/stations/w.json

          echo "Asset configuration OK."

      - name: Set compile SDK
        run: |
          set -e

          sed -i \
            's/flutter.compileSdkVersion/36/g' \
            android/app/build.gradle.kts

          sed -i \
            's/flutter.targetSdkVersion/36/g' \
            android/app/build.gradle.kts

          echo "compileSdk configuration:"
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Analyze
        run: |
          flutter analyze

      - name: Test
        run: |
          flutter test

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Check APK
        run: |
          set -e

          test -s build/app/outputs/flutter-apk/app-release.apk

          echo "APK successfully created."

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d-ticket-navigator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
